name: django-react-starter-dev

services:
  api:
    image: ${PYTHON_IMAGE:-python:3.14-slim}
    init: true
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DATABASE_PATH: /data/db.sqlite3
    volumes:
      - ..:/app
      - dev_data:/data
      - pip_cache:/root/.cache/pip
    command:
      - sh
      - -ec
      - |
        python -m pip install --disable-pip-version-check -r requirements.txt
        python manage.py migrate --noinput
        exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20

  ui:
    image: ${NODE_IMAGE:-node:22-slim}
    init: true
    working_dir: /app/client
    environment:
      DJANGO_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "1"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../client:/app/client
      - node_modules:/app/client/node_modules
      - npm_cache:/root/.npm
    command:
      - sh
      - -ec
      - |
        npm ci --prefer-offline --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  dev_data:
  pip_cache:
  node_modules:
  npm_cache:
